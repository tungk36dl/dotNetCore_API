stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level:        info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h   # 2 days

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: projectcore
  storage:
    path: /var/tempo/generator/wal

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 100
      queue_depth:  10000

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
