global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: projectcore

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:

  # ── ProjectCore API (/metrics — prometheus-net) ──────────────────────────────
  - job_name: projectcore-api
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Prometheus self-monitoring ────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
